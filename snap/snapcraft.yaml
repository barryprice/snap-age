name: age-bp
title: age
base: core26
adopt-info: age
license: BSD-3-Clause
summary: a simple, modern and secure file encryption tool
description: |
  age is a simple, modern and secure file encryption tool, format, and Go library.

  It features small explicit keys, post-quantum support, no config options, and UNIX-style composability.

  For convenient aliases:

  sudo snap alias age-bp.age age

  sudo snap alias age-bp.age-inspect age-inspect

  sudo snap alias age-bp.age-keygen age-keygen

contact:
  - https://github.com/barryprice
issues:
  - https://github.com/barryprice/snap-age/issues
source-code:
  - https://github.com/FiloSottile/age
website:
  - https://age-encryption.org/
grade: stable
confinement: strict

apps:
  age:
    command: bin/age
    plugs: [home, removable-media]

  age-keygen:
    command: bin/age-keygen
    plugs: [home, removable-media]

  age-inspect:
    command: bin/age-inspect
    plugs: [home, removable-media]

parts:
  age:
    plugin: nil
    source: https://github.com/FiloSottile/age.git
    source-type: git
    build-snaps:
      # Base Go toolchain, pinned to match the minor in upstream's go.mod
      # `toolchain` directive (currently go1.25.x). Bump manually when upstream
      # raises it — Renovate can't track another repo's go.mod.
      - go/1.25/stable
    override-build: |
      cd "${CRAFT_PART_SRC}"

      # Pinned upstream release tag. Renovate bumps this line automatically
      # when FiloSottile/age publishes a new release (see renovate.json).
      # renovate: datasource=github-releases depName=FiloSottile/age
      age_version="v1.3.2"

      # Ensure the pinned tag exists locally (shallow clones may omit it),
      # then build exactly that release.
      git fetch --tags --force origin
      git checkout --detach "${age_version}"

      mkdir -p "${CRAFT_PART_INSTALL}/bin"
      # GOTOOLCHAIN=auto keeps the Go toolchain in sync with the version pinned
      # by the upstream go.mod ("toolchain goX.Y.Z"); if the base Go 1.25 is
      # older than the module requires, the exact toolchain is downloaded and
      # used automatically.
      CGO_ENABLED=0 GOTOOLCHAIN=auto go build \
        -trimpath -mod=readonly \
        -ldflags "-X main.Version=${age_version}" \
        -o "${CRAFT_PART_INSTALL}/bin/" \
        ./cmd/age ./cmd/age-keygen ./cmd/age-inspect

      # Safety gate: run the freshly built binary so we never package a snap
      # whose binary doesn't execute and report a version. Deriving the snap
      # version from the binary's own --version output (rather than the release
      # tag string) also keeps it grounded in what the binary actually reports
      # if upstream ever changes how the version is computed.
      snap_version="$("${CRAFT_PART_INSTALL}/bin/age" --version)" || {
        echo "age --version failed" >&2
        exit 1
      }
      [ -n "${snap_version}" ] || {
        echo "age --version produced no output" >&2
        exit 1
      }
      # Snap versions conventionally omit the leading "v" from the release tag.
      craftctl set version="${snap_version#v}"
