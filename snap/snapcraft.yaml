name: age-bp
title: age
base: core26
adopt-info: age
license: BSD-3-Clause
summary: a simple, modern and secure file encryption tool
description: |
  age is a simple, modern and secure file encryption tool, format, and Go library.

  It features small explicit keys, post-quantum support, no config options, and UNIX-style composability.
contact:
  - https://github.com/barryprice
issues:
  - https://github.com/barryprice/snap-age/issues
source-code:
  - https://github.com/FiloSottile/age
website:
  - https://age-encryption.org/
grade: stable
confinement: strict

platforms:
  amd64:
    build-on:
      - amd64
  arm64:
    build-on:
      - arm64

apps:
  age:
    command: bin/age
    plugs: [home, removable-media]
    aliases: [age]

  age-keygen:
    command: bin/age-keygen
    plugs: [home, removable-media]
    aliases: [age-keygen]

  age-inspect:
    command: bin/age-inspect
    plugs: [home, removable-media]
    aliases: [age-inspect]

parts:
  age:
    plugin: nil
    source: https://github.com/FiloSottile/age.git
    source-type: git
    build-snaps:
      - go/1.25/stable
    override-build: |
      cd "${CRAFT_PART_SRC}"
      git fetch --tags --force origin
      latest_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0)"
      git checkout "${latest_tag}"
      mkdir -p "${CRAFT_PART_INSTALL}/bin"
      CGO_ENABLED=0 GOTOOLCHAIN=local go build \
        -trimpath -mod=readonly \
        -ldflags "-X main.Version=${latest_tag}" \
        -o "${CRAFT_PART_INSTALL}/bin/" \
        ./cmd/age ./cmd/age-keygen ./cmd/age-inspect
      craftctl set version="$(${CRAFT_PART_INSTALL}/bin/age --version)"
