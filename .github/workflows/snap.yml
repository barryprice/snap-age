name: snapcraft

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Merge gate only: verify the snap still builds on pushes/pull requests so
  # merges can't break the build. Building AND publishing is handled by
  # snapcraft.io (which schedules its own builds and pushes to latest/edge),
  # so this workflow never publishes and this repo is never tagged.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        id: build
      - name: Upload the snap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: age-bp
          path: ${{ steps.build.outputs.snap }}

  # Run Snapcraft's linters against the built snap. This is best-effort:
  # switch continue-on-error to false once the snap is lint-clean.
  lint:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: age-bp
          path: snap
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
      - name: Install LXD
        run: sudo snap install lxd
      - name: Initialise LXD
        run: sudo lxd init --auto
      - name: Ensure LXD networking isn't blocked
        run: sudo iptables -P FORWARD ACCEPT
      - name: Lint the built snap
        run: sudo snapcraft lint snap/*.snap
